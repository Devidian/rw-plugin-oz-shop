
# chat command used to open/list/buy shop offers
shopCommand=shop

# send plugin welcome message to player on login
sendPluginWelcome=false

# system-shop offer file copied from system-offers.default.json on first run
systemOffersFile=system-offers.json

# optional central currency for all system-shop offers; empty uses Wallet default or legacy offer currency
systemShopCurrency=

# master switch for system-shop offers; shop zones may override this with systemShop -1, 0, or 1
systemShopEnabled=true

# generate system-offer-export.json and system-recipes-export.json next to system offers
generateDefinitionExports=false

# enables dynamic stock checks and stock-based buy/sell prices for configured system offers
dynamicEconomyEnabled=true

# hours between automatic stock reconciliation ticks; partial item changes accumulate
economyTickIntervalHours=1

# optional operational reports after changed economy ticks
economyReportGlobal=false
economyReportZones=false
economyReportTraders=false
# Exact names separated by commas; optional language per recipient, e.g. Spieler1;de,Spieler2;en
economyReportRecipients=

# master switch for player shop access
shopEnabled=true

# when true, non-admin players can only use /shop inside areas marked as shop areas
requireShopZone=false

# admin-managed shop area file
shopZonesFile=shop-zones.json

# show a compact HUD indicator while players are inside a shop area
showShopZoneIndicator=true

# allow bridge/native route layers to expose SQLite shop-zone metadata
exposeShopZones=true
