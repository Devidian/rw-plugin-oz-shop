
# possible values: OFF,FATAL,ERROR,WARN,INFO,DEBUG,TRACE,ALL
logLevel=ALL

# reload plugin settings when settings.properties changes
reloadOnChange=true

# chat command used to open/list/buy shop offers
shopCommand=shop

# send plugin welcome message to player on login
sendPluginWelcome=false

# system-shop offer file copied from system-offers.default.json on first run
systemOffersFile=system-offers.json

# master switch for system-shop offers; shop zones may override this with systemShop -1, 0, or 1
systemShopEnabled=true

# master switch for player shop access
shopEnabled=true

# when true, non-admin players can only use /shop inside areas marked as shop areas
requireShopZone=false

# admin-managed shop area file
shopZonesFile=shop-zones.json

# show a compact HUD indicator while players are inside a shop area
showShopZoneIndicator=true
